# Wan2.2 VAE + Wan2.2-TI2V DiT, first-frame conditioned 16-frame future prediction on NanoVVM mix5
# at 128x128. data.train/val are the 18 cond1gen16_interval3 train / 18 val manifests of
# eupe_mix5.yaml, copied unchanged (tests/test_nanovvm_wan22.py checks they stay equal); paths are
# relative to the NanoVVM data root (datasets.nanovvm in the --paths file).
# latent_normalizer: per-channel statistics of the Wan2.2 future latents (z1..z4 of the joint
# 17-frame encoding, after Wan's official normalization) on 20000 seeded train clips; the DiT's z0
# input is normalized with the same statistics, and z0's own statistics are recorded in the file's
# metadata (condition_latent). Fit on first launch if missing.
include: _wan22_common.yaml
run_name: wan22_ti2v_mix5_cond1gen16_res128
latent_normalizer:
  path: ckpts/nanovvm_video_pred/latent_stats/wan22_mix5_cond1gen16_res128_future_fp32.pt
  fit_clips: 20000
  fit_seed: 0
  batch_size: 16
data:
  train:
    sources:
      - name: bridgedatav2
        dataset: bridgedatav2
        root: bridgedatav2_video/data/raw
        manifest: bridgedatav2_video/manifests/cond1gen16_interval3/split_val0.0001_min100/train/manifest.json
        manifest_meta: bridgedatav2_video/manifests/cond1gen16_interval3/split_val0.0001_min100/train/meta.yaml
      - name: droid/exterior_image_1_left
        dataset: droid
        root: droid_video/data/exterior_image_1_left
