# mix5 scaling ladder, xxl: k = 22 heads, encoder depth L = 37.
# Scaling rule (one knob k; the default dit_first_frame_prediction.yaml is k = 16, L = 28):
#   encoder width 72k (head_dim 72), decoder width 128k (head_dim 128), k heads each,
#   decoder depth max(1, round(L/14)), encoder_depth round(L*8/28), mlp_ratio 4.
# DiT parameters: 2140.0M total, 1672.1M encoder blocks, 428.4M decoder blocks
# (+0.8% vs NanoVVM xxl, 2124.1M: n_layer 48, n_embd 1920, n_head 30).
# Everything else is in ../_mix5_common.yaml. Lists are replaced, not merged, by includes,
# so dit.* and wandb.tags are written out in full.
include: ../_mix5_common.yaml
run_name: vrae_eupe_mix5_xxl_xpred_interval3_cond1gen16_bs64_lr2e-4_wd0_ep1
dit:
  hidden_size: [1584, 2816]
  depth: [37, 3]
  num_heads: [22, 22]
  encoder_depth: 11
  mlp_ratio: 4.0
wandb:
  tags: [nanovvm, video_prediction, first_frame, eupe, mix5, scaling_ladder, xxl]
