# mix5 scaling ladder, medium: Wan2.2 VAE + Wan2.2-TI2V DiT at 128x128, global batch 32, trained with
# improved MeanFlow (iMF: boundary tangent u(z, t, 0), 50% r != t, no CFG).
# Equal to wan22_ti2v_mix5_medium_xpred_interval3_cond1gen16_res128_bs32_lr2e-4_wd0_ep1.yaml
# except the transport, the DiT's MeanFlow inputs, sampling, run_name and the W&B tags, which come from
# ../../meanflow/_imf.yaml (included last, so it overrides the flow-matching transport and sampling).
# DiT parameters with the zero-initialized h embedding: 277.70M
# (+1.97M over the 275.73M below).
# Wan2.2-TI2V-5B proportions (dim 3072, ffn_dim 14336, 24 heads, 30 layers):
#   head_dim 128, so num_heads = dim / 128; ffn_dim = round(14/3 * dim / 128) * 128 (5B: 14336/3072 = 14/3);
#   dim / num_layers ~ 102.4 (5B: 3072/30), with the layer count moved (85..107) to meet the parameter
#   target; base_depth (internal-guidance head) = max(1, round(2L/7)) (V-RAE's encoder_depth/depth = 8/28).
# medium: dim 1280 = 10 heads x 128, 12 layers, ffn_dim 6016, dim/L = 106.7, base_depth 3.
# DiT parameters: 275.73M including the internal-guidance head and the null z0
# (+3.8% vs NanoVVM medium, 265.7M).
# Data, optimization, EMA, CFG dropout, internal guidance and FVD equal vrae_eupe_mix5_medium_xpred_interval3_cond1gen16_res128_bs32_lr2e-4_wd0_ep1.yaml:
#   data and latent_normalizer from ../../wan22_mix5.yaml; training, wandb and fvd from ../_mix5_recipe.yaml;
#   then the 128x128 / batch-32 values below (2 GPUs x 16 clips, no accumulation).
#   transport.time_dist_shift = sqrt(4 chunks * 8 * 8 * 48 / 4096) = sqrt(3) (V-RAE res128: sqrt(48)).
# Lists are replaced, not merged, by includes, so wandb.tags is written out in full.
include:
  - ../../wan22_mix5.yaml
  - ../_mix5_recipe.yaml
  - ../../meanflow/_imf.yaml
run_name: wan22_ti2v_mix5_medium_imf_upred_interval3_cond1gen16_res128_bs32_lr2e-4_wd0_ep1
dit:
  dim: 1280
  num_heads: 10
  num_layers: 12
  ffn_dim: 6016
  base_depth: 3
data:
  image_size: 128
fvd:
  image_size: 128
transport:
  time_dist_shift: 1.7320508075688772
training:
  global_batch_size: 32
  gradient_accumulation_steps: 1
wandb:
  tags: [nanovvm, video_prediction, first_frame, wan22_vae, wan_ti2v_dit, mix5, scaling_ladder, medium, res128, bs32, meanflow, imf]
