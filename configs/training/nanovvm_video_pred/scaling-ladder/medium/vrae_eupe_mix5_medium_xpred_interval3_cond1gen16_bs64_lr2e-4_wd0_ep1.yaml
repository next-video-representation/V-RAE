# mix5 scaling ladder, medium: k = 11 heads, encoder depth L = 19.
# Scaling rule (one knob k; the default dit_first_frame_prediction.yaml is k = 16, L = 28):
#   encoder width 72k (head_dim 72), decoder width 128k (head_dim 128), k heads each,
#   decoder depth max(1, round(L/14)), encoder_depth round(L*8/28), mlp_ratio 4.
# DiT parameters: 262.7M total, 214.8M encoder blocks, 35.7M decoder blocks
# (-1.1% vs NanoVVM medium, 265.7M: n_layer 24, n_embd 960, n_head 15).
# Everything else is in ../_mix5_common.yaml. Lists are replaced, not merged, by includes,
# so dit.* and wandb.tags are written out in full.
include: ../_mix5_common.yaml
run_name: vrae_eupe_mix5_medium_xpred_interval3_cond1gen16_bs64_lr2e-4_wd0_ep1
dit:
  hidden_size: [792, 1408]
  depth: [19, 1]
  num_heads: [11, 11]
  encoder_depth: 5
  mlp_ratio: 4.0
wandb:
  tags: [nanovvm, video_prediction, first_frame, eupe, mix5, scaling_ladder, medium]
