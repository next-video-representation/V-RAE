# Shared settings of the six mix5 scaling-ladder sizes (tiny, small, medium, large, xl, xxl).
# Not runnable on its own: each <size>/vrae_eupe_mix5_<size>_*.yaml adds run_name, the DiT
# size and its W&B tags.
#
# Aligned with NanoVVM's batch-64 ladder, nanovvm@94cc92d
# configs/scaling-ladder/<size>/mix5_<size>_vpred_interval3_l1_cond1gen16_bs64_lr2e-4_wd0_ep1.yaml:
#   data      inherited unchanged from eupe_mix5.yaml: the same 18 train / 18 val manifests,
#             256x256 short-side bilinear resize (antialias off), center crop, no flip,
#             17 frames at interval 3 from each record's fixed start, sources concatenated
#             and reshuffled every epoch.
#   training  NanoVVM's recipe (training.* of the ladder files; bf16 is scripts/train.sh's
#             default precision). NanoVVM's weight_decay_split: gpt is a no-op at
#             weight_decay 0 and is not ported.
#   wandb     NanoVVM's destination (ENTITY/PROJECT from the user's environment, written
#             out here), log_interval and sample_every; samples use up to 4 clips.
# latent_normalizer is inherited from eupe_mix5.yaml: it depends only on stage 1 and the
# train data, so all six sizes share one future-latent statistics file.
include: ../eupe_mix5.yaml
training:
  epochs: 1
  global_batch_size: 64
  gradient_accumulation_steps: 4
  clip_grad: 1.0
  precision: bf16
  checkpoint_interval: 5000
  optimizer: {name: adamw, lr: 2.0e-4, betas: [0.9, 0.95], weight_decay: 0.0, eps: 1.0e-8}
  # Warmup and decay end are fractions of epochs * optimizer steps per epoch, rounded with
  # round(). warmup_steps: null switches off the constant schedule's warmup_steps: 0 that
  # _eupe_common.yaml would otherwise merge in (includes merge mappings key by key).
  scheduler:
    name: cosine
    warmup_steps: null
    warmup_ratio: 0.02
    decay_end_ratio: 1.0
    final_lr: 2.0e-5
    warmup_from_zero: true
  ema: {decay: 0.9995}
wandb:
  entity: zhaosh5t5an
  project: nanovvm
  mode: online          # falls back to offline when no W&B API key is found
  resume: allow
  log_interval: 5
  sample_interval: 500
  sample_count: 4
