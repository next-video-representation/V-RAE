# mix5 scaling ladder, xl: k = 18 heads, encoder depth L = 33.
# Scaling rule (one knob k; the default dit_first_frame_prediction.yaml is k = 16, L = 28):
#   encoder width 72k (head_dim 72), decoder width 128k (head_dim 128), k heads each,
#   decoder depth max(1, round(L/14)), encoder_depth round(L*8/28), mlp_ratio 4.
# DiT parameters: 1217.5M total, 998.5M encoder blocks, 191.2M decoder blocks
# (-0.9% vs NanoVVM xl, 1229.2M: n_layer 40, n_embd 1600, n_head 25).
# Everything else is in ../_mix5_common.yaml. Lists are replaced, not merged, by includes,
# so dit.* and wandb.tags are written out in full.
include: ../_mix5_common.yaml
run_name: vrae_eupe_mix5_xl_xpred_interval3_cond1gen16_bs64_lr2e-4_wd0_ep1
dit:
  hidden_size: [1296, 2304]
  depth: [33, 2]
  num_heads: [18, 18]
  encoder_depth: 9
  mlp_ratio: 4.0
wandb:
  tags: [nanovvm, video_prediction, first_frame, eupe, mix5, scaling_ladder, xl]
