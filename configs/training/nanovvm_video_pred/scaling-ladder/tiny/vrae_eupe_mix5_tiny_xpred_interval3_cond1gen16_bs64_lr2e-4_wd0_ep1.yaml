# mix5 scaling ladder, tiny: k = 3 heads, encoder depth L = 6.
# Scaling rule (one knob k; the default dit_first_frame_prediction.yaml is k = 16, L = 28):
#   encoder width 72k (head_dim 72), decoder width 128k (head_dim 128), k heads each,
#   decoder depth max(1, round(L/14)), encoder_depth round(L*8/28), mlp_ratio 4.
# DiT parameters: 9.5M total, 5.1M encoder blocks, 2.7M decoder blocks
# (-3.6% vs NanoVVM tiny, 9.9M: n_layer 8, n_embd 320, n_head 5).
# Everything else is in ../_mix5_common.yaml. Lists are replaced, not merged, by includes,
# so dit.* and wandb.tags are written out in full.
include: ../_mix5_common.yaml
run_name: vrae_eupe_mix5_tiny_xpred_interval3_cond1gen16_bs64_lr2e-4_wd0_ep1
dit:
  hidden_size: [216, 384]
  depth: [6, 1]
  num_heads: [3, 3]
  encoder_depth: 2
  mlp_ratio: 4.0
wandb:
  tags: [nanovvm, video_prediction, first_frame, eupe, mix5, scaling_ladder, tiny]
